# Ryven Navy (coolors 0d1b2a-1b263b-415a77-778da9-e0e1dd)
# dunst colors: #RRGGBBAA (alpha last). All main options must live in
# [global]; the text color key is `foreground`.
[global]
frame_color = #415a77
background = #142032f2
foreground = #e0e1dd
font = Inter 10
timeout = 5
gap_size = 4
separator_color = frame

[urgency_low]
background = #142032f2
frame_color = #415a77
foreground = #e0e1dd

[urgency_normal]
background = #1b263bf2
frame_color = #778da9
foreground = #e0e1dd

[urgency_critical]
background = #1b263bf2
frame_color = #d98a8a
foreground = #e0e1dd
