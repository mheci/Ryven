# Ryven-Kunzite hyprlock defaults (copied to /etc/skel/.config/hypr and
# /etc/xdg/hypr). Ryven Navy palette (coolors 0d1b2a-1b263b-415a77-778da9-
# e0e1dd). hyprlang colors are 0xAARRGGBB (alpha first) or rgba(RRGGBBAA).

background {
    monitor =
    path = /usr/share/wallpapers/Ryven/contents/images/3840x2160.png
    blur_passes = 2
    color = 0xcc0d1b2a
}

input-field {
    monitor =
    size = 400, 60
    outline_thickness = 2
    rounding = 8
    outer_color = 0xff415a77
    inner_color = 0xcc1b263b
    font_color = 0xffe0e1dd
    font_family = Inter
    check_color = 0xff84c9a3
    fail_color = 0xffd98a8a
    fail_text = <i>wrong password</i>
    placeholder_text = <i>password</i>
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = 0xffe0e1dd
    font_size = 64
    font_family = Inter
    position = 0, 80
    halign = center
    valign = center
}
