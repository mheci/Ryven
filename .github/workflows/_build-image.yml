---
# Reusable compose/push job. Callers are the public workflow records.
name: Build image (reusable)
on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      containerfile:
        required: true
        type: string
      cst:
        required: true
        type: string
      publish:
        description: Push/sign/attest (false on pull_request)
        required: true
        type: boolean
    secrets:
      SIGNING_SECRET:
        required: false

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

jobs:
  build_push:
    name: Build ${{ inputs.image }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        run: |
          echo "IMAGE_NAME=${{ inputs.image }}" >> $GITHUB_ENV
          echo "CONTAINERFILE=${{ inputs.containerfile }}" >> $GITHUB_ENV

      - name: Default Tag
        run: |
          DEFAULT_TAG=$(just generate-default-tag)
          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Build Image
        id: build-image
        run: |
          just build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      - name: Rechunk with rpm-ostree
        id: rechunk
        run: |
          just ostree-rechunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"
          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      - name: bootc container lint
        run: |
          set -euo pipefail
          podman run --rm --privileged --entrypoint bootc \
            "${IMAGE_NAME}:${DEFAULT_TAG}" container lint

      - name: Container Structure Test
        env:
          CST_VER: v1.22.1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/cst \
            "https://github.com/GoogleContainerTools/container-structure-test/releases/download/${CST_VER}/container-structure-test-linux-amd64"
          chmod +x /tmp/cst
          tar_path="${RUNNER_TEMP}/ryven.tar"
          podman save -o "${tar_path}" "${IMAGE_NAME}:${DEFAULT_TAG}"
          /tmp/cst test --driver tar --image "${tar_path}" \
            --config ${{ inputs.cst }}
          rm -f "${tar_path}"

      - name: Grype
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: grype
        with:
          image: "${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}"
          fail-build: false
          severity-cutoff: critical
          output-format: sarif

      - name: Upload Grype SARIF
        if: always() && steps.grype.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-${{ inputs.image }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: inputs.publish
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done
          digest=$(< /tmp/digestfile)
          echo "digest=${digest}" >> $GITHUB_OUTPUT

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: inputs.publish
        with:
          cosign-release: 'v3.1.2'

      - name: Sign image with Cosign key
        if: inputs.publish
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          if [[ -z ${COSIGN_PRIVATE_KEY} ]]; then
            echo 'SIGNING_SECRET unset; skipping static-key Cosign'
            exit 0
          fi
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Sign image with Cosign OIDC
        if: inputs.publish
        env:
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          cosign sign -y "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Attest build provenance
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push-image.outputs.digest }}
          push-to-registry: true
