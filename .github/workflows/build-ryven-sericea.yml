---
name: Build ryven-sericea
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 0'
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/_build-image.yml
    with:
      image: ryven-sericea
      containerfile: Containerfile.sericea
      cst: ci/container-structure-test-sericea.yaml
      publish: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    secrets: inherit
