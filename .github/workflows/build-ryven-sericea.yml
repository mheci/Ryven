---
# Independent workflow. No concurrency group: GitHub cancels pending runs in a
# shared group ("higher priority waiting request") even with
# cancel-in-progress: false. Sibling images have their own files so a failed
# compose cannot block another image publishing.
name: Build ryven-sericea
on:
  pull_request:
    branches:
      - main
  schedule:
    # Weekly rebuild/update every Saturday (06:00 UTC) so the image always
    # tracks the current Fedora 44 release tip (floating :44 base + refresh
    # upgrade in the build).
    - cron: '0 6 * * 6'
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  IMAGE_NAME: "ryven-sericea"
  CONTAINERFILE: "Containerfile.sericea"

jobs:
  build_push:
    name: Build ryven-sericea
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Default Tag
        run: |
          DEFAULT_TAG=$(just generate-default-tag)
          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Fetch BetterBird
        # Host-side: the in-container fetch to betterbird.eu / its CDN has
        # repeatedly killed the build container without a trace. The
        # tarball lands in _build/betterbird/ inside the build context;
        # the image installs it from /ctx (build script). Plain bash (no
        # recipe indirection) so every line of the fetch is in this step's
        # own log, and the final test fails the step if nothing landed.
        run: |
          set -euox pipefail
          # CDN first (a CDN built for bulk downloads; the origin sits on
          # small shared hosting that intermittently drops datacenter
          # connections); origin as canonical fallback.
          SOURCES=('https://betterbird-downloads.b-cdn.net' 'https://www.betterbird.eu/downloads')
          listing=''
          for base in "${SOURCES[@]}"; do
            # --max-time caps each attempt (a silently dropped connection
            # must not consume the whole retry budget).
            if listing=$(curl -fsSL --proto '=https' --max-time 60 --retry 2 --retry-all-errors --retry-delay 5 --retry-max-time 150 --connect-timeout 30 "${base}/"); then
              break
            fi
            echo "BetterBird: listing fetch failed from ${base}; trying next source" >&2
          done
          if [[ -z ${listing} ]]; then
            echo 'BetterBird: listing fetch failed from all sources' >&2
            exit 1
          fi
          echo "BetterBird: listing fetched from ${base} ($(wc -c <<<"${listing}") bytes)"
          # Current release of each ESR line first ("-latest-" marker),
          # then every plain en-US x86_64 build. Exclude the Previous/
          # archive; highest version wins.
          files=$(grep -oE 'LinuxArchive/betterbird-[^"]*-latest-[^"]*\.en-US\.linux-x86_64\.tar\.xz' <<<"${listing}" | grep -v 'Previous/' | LC_ALL=C sort -V || true)
          if [[ -z ${files} ]]; then
            files=$(grep -oE 'LinuxArchive/betterbird-[^"]*\.en-US\.linux-x86_64\.tar\.xz' <<<"${listing}" | grep -vE 'Previous/|-latest-' | LC_ALL=C sort -V || true)
          fi
          if [[ -z ${files} ]]; then
            echo 'BetterBird: no x86_64 tarball found in the download listing' >&2
            exit 1
          fi
          base2=''
          for base2 in "${SOURCES[@]}"; do
            [[ ${base2} != ${base} ]] && break
          done
          rel=$(tail -n1 <<<"${files}")
          out="_build/betterbird/$(basename "${rel}")"
          mkdir -p _build/betterbird
          echo "BetterBird: downloading ${rel}"
          if ! curl -fsSL --proto '=https' --retry 2 --retry-all-errors --retry-delay 10 --retry-max-time 900 --connect-timeout 30 --max-time 900 -o "${out}" "${base}/${rel}"; then
            echo "BetterBird: tarball download failed from ${base}; retrying via ${base2}" >&2
            curl -fsSL --proto '=https' --retry 2 --retry-all-errors --retry-delay 10 --retry-max-time 900 --connect-timeout 30 --max-time 900 -o "${out}" "${base2}/${rel}"
          fi
          ls -l "${out}"
          test -s "${out}" || { echo 'BetterBird: tarball empty after download' >&2; exit 1; }
          echo "BetterBird fetch done: ${out}"

      - name: Build Image
        id: build-image
        run: |
          just build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      - name: Rechunk with rpm-ostree
        id: rechunk
        run: |
          just ostree-rechunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"
          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      - name: bootc container lint
        run: |
          set -euo pipefail
          podman run --rm --privileged --entrypoint bootc \
            "${IMAGE_NAME}:${DEFAULT_TAG}" container lint

      - name: Container Structure Test
        env:
          CST_VER: v1.22.1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/cst \
            "https://github.com/GoogleContainerTools/container-structure-test/releases/download/${CST_VER}/container-structure-test-linux-amd64"
          chmod +x /tmp/cst
          sock="${RUNNER_TEMP}/podman.sock"
          podman system service --time=0 "unix://${sock}" &
          for i in $(seq 1 30); do
            [[ -S ${sock} ]] && break
            sleep 1
          done
          [[ -S ${sock} ]]
          export DOCKER_HOST="unix://${sock}"
          export TMPDIR="${RUNNER_TEMP}"
          /tmp/cst test --driver docker --image "${IMAGE_NAME}:${DEFAULT_TAG}" \
            --config ci/container-structure-test-sericea.yaml

      - name: Grype
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: grype
        with:
          image: "${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}"
          fail-build: false
          severity-cutoff: critical
          output-format: sarif

      - name: Upload Grype SARIF
        if: always() && steps.grype.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-ryven-sericea

      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done
          digest=$(< /tmp/digestfile)
          echo "digest=${digest}" >> $GITHUB_OUTPUT

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          cosign-release: 'v3.1.2'

      - name: Sign image with Cosign key
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          if [[ -z ${COSIGN_PRIVATE_KEY} ]]; then
            echo 'SIGNING_SECRET unset; skipping static-key Cosign'
            exit 0
          fi
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Sign image with Cosign OIDC
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          cosign sign -y "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Attest build provenance
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push-image.outputs.digest }}
          push-to-registry: true
