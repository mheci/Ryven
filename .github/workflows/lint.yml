---
# Static checks only. Does not build the bootc image. cancel-in-progress is
# false so a follow-up push never kills an in-flight lint on another SHA.
name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: ShellCheck scripts
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find . -type f -name '*.sh' ! -path './.git/*')
          shellcheck --severity=error -x "${scripts[@]}"

  hadolint:
    name: Hadolint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Containerfile
          config: .hadolint.yaml
          failure-threshold: warning
