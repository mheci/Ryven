general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# No screen timeout, no automatic suspend: idle only locks the session.
# DPMS and suspend stay manual (power button, menu, or explicit command).
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}
