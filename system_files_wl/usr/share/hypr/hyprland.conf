# Ryven-WL Hyprland defaults (Omarchy-inspired, master layout, NVIDIA-safe).
# Copied to /etc/skel/.config/hypr and /etc/xdg/hypr.

$terminal = ghostty
$launcher = hyprlauncher
$filemanager = thunar
$browser = helium-browser

monitor=,preferred,auto,auto

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland
env = SDL_VIDEODRIVER,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = NVD_BACKEND,direct
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = __GL_VRR_ALLOWED,1
env = __GL_GSYNC_ALLOWED,1

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(89b4faee)
    col.inactive_border = rgba(313244aa)
    layout = master
    allow_tearing = true
    resize_on_border = true
}

decoration {
    rounding = 8
    blur {
        enabled = true
        size = 4
        passes = 2
    }
}

animations {
    enabled = true
}

master {
    new_status = master
    mfact = 0.55
    new_on_top = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    vrr = 1
    vfr = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    focus_on_activate = true
}

cursor {
    # NVIDIA-first default (image targets NVIDIA open): software cursors
    # avoid the invisible-cursor bug on nvidia-drm. Intel/AMD-only hosts
    # may set no_hardware_cursors = false for lower latency.
    no_hardware_cursors = true
    hide_on_key_press = true
}

input {
    kb_layout = us
    follow_mouse = 1
    accel_profile = flat
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap_to_click = true
    }
}

render {
    explicit_sync = 2
    direct_scanout = true
}

xwayland {
    enabled = true
    force_zero_scaling = true
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# Tearing only for games (Steam AppIDs and Windows titles), never global:
# a global `immediate` rule defeats VSync on desktop, browser, and video.
windowrulev2 = immediate, class:^(steam_app_.*)$
windowrulev2 = immediate, class:^(.*\.exe)$
windowrulev2 = float, class:^(org.kde.kdeconnect.daemon)$
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, title:^(cliphist)$

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = wl-clip-persist --clipboard regular
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = dunst
exec-once = hyprpaper
exec-once = hypridle
exec-once = hyprpolkitagent
exec-once = hyprsunset
exec-once = uwsm app -- kdeconnectd
exec-once = uwsm app -- nm-applet --indicator
exec-once = uwsm app -- blueman-applet
exec-once = uwsm app -- quickshell

bind = SUPER, Return, exec, $terminal
bind = SUPER, D, exec, $launcher
bind = SUPER, E, exec, $filemanager
bind = SUPER, B, exec, $browser
bind = SUPER, Q, killactive
bind = SUPER SHIFT, E, exec, uwsm stop
bind = SUPER, F, fullscreen
bind = SUPER, Space, togglefloating
bind = SUPER, V, exec, sh -c 'cliphist list | fuzzel --dmenu --with-nth 2 | cliphist decode | wl-copy'
bind = SUPER SHIFT, X, exec, hyprlock
bind = SUPER, P, exec, hyprpicker -a
bind = , Print, exec, sh -c 'grim -g "$(slurp)" - | satty -f - --copy-command wl-copy'
bind = SUPER, Print, exec, sh -c 'grim - | wl-copy'
bind = SUPER SHIFT, R, exec, sh -c 'gpu-screen-recorder -w screen -f 60 -a default_output -o "$HOME/Videos/ryven-$(date +%Y%m%d-%H%M%S).mp4"'

bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
