# NVIDIA Wayland for Sway. Do not set LIBVA_DRIVER_NAME=nvidia (hybrid/iGPU).
# NVD_BACKEND, MOZ_ENABLE_WAYLAND and ELECTRON_OZONE_PLATFORM_HINT are already
# set image-wide (50-ryven-shader-cache.conf / 62-ryven-browsers.conf).
GBM_BACKEND=nvidia-drm
__GLX_VENDOR_LIBRARY_NAME=nvidia
XDG_CURRENT_DESKTOP=sway
XDG_SESSION_TYPE=wayland
QT_QPA_PLATFORM=wayland
GDK_BACKEND=wayland,x11
SDL_VIDEODRIVER=wayland,x11
