# Ryven-Sericea Sway overlay (included from /etc/sway/config).
# Preferred mode = panel's advertised max res + refresh.
# Omit explicit mode so Sway uses each connector's preferred (max res/Hz).
output * {
    max_render_time off
    adaptive_sync on
    allow_tearing yes
}

input * {
    xkb_layout us
    tap_to_click enabled
    natural_scroll enabled
}

# Sway has no Hyprland "master" layout; default tiling + horizontal split
# is the closest stock equivalent. Users can `layout splith`.
workspace_layout default
default_orientation horizontal
focus_follows_mouse yes
mouse_warping container

set $mod Mod4
set $term ghostty
set $menu fuzzel
set $browser firefox

bindsym $mod+Return exec $term
bindsym $mod+d exec $menu
bindsym $mod+b exec $browser
bindsym $mod+q kill
bindsym $mod+Shift+e exec swaynag -t warning -m 'Exit Sway?' -b 'Yes' 'swaymsg exit'
bindsym $mod+f fullscreen
bindsym $mod+Shift+space floating toggle
bindsym $mod+v exec sh -c 'cliphist list | fuzzel --dmenu --with-nth 2 | cliphist decode | wl-copy'
bindsym $mod+Shift+x exec swaylock -f
bindsym Print exec sh -c 'grim -g "$(slurp)" - | satty -f - --copy-command wl-copy'
bindsym $mod+Print exec sh -c 'grim - | wl-copy'

bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+l focus right
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5

# Tearing only for games, never global: a global allow_tearing rule
# defeats VSync on desktop, browser, and video.
for_window [app_id="^steam_app_.*$"] allow_tearing yes

# Quickshell provides the bar (workspaces, tray, clock); no swaybar block,
# waybar is not installed. The bar runs as a user service so
# quickshell-reload.path can restart it whenever its config changes; the
# session environment is imported first so the service can find the
# compositor. `exec` lines are idempotent so `swaymsg reload` cannot stack
# duplicate daemons.
exec systemctl --user import-environment DISPLAY WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP
exec systemctl --user restart quickshell.service
exec --no-startup-id sh -c 'pidof nm-applet || exec nm-applet'
exec --no-startup-id sh -c 'pidof blueman-applet || exec blueman-applet'
exec --no-startup-id sh -c 'pidof wl-clip-persist || exec wl-clip-persist --clipboard regular'
exec --no-startup-id sh -c 'pidof dunst || exec dunst'
# Polkit authentication agent (mate-polkit): without it, privilege prompts
# (pkexec, GParted, nm-applet VPN secrets, ...) have nowhere to render.
exec --no-startup-id sh -c 'pidof polkit-mate-authentication-agent-1 || exec /usr/libexec/polkit-mate-authentication-agent-1'
exec swaybg -i /usr/share/wallpapers/Ryven/contents/images/3840x2160.png -m fill
# No screen timeout, no automatic suspend: idle only locks the session.
exec swayidle -w timeout 300 'swaylock -f' before-sleep 'swaylock -f'
