# Realtime scheduling + mlock headroom for the audio stack, for every user.
#
# Fedora ships /etc/security/limits.d/25-pw-rlimits.conf granting these to
# the @pipewire group — but nothing ever adds users to that group, so it is
# inert on stock installs. These entries feed PipeWire's module-rt direct
# privilege path (used when neither the Realtime portal nor RTKit answer:
# it then calls sched_setscheduler itself, bounded by RLIMIT_RTPRIO) and
# give JACK clients the usual rtprio/memlock headroom. memlock unlimited
# lets audio apps pin their buffers against page-fault xruns.
#
# Single-user desktop image: granting this to all logged-in users is the
# same trade-off pro-audio setups (Arch @audio, Ubuntu Studio) make.
# The `*` wildcard does not match root in pam_limits, hence both stanzas.
*     -   rtprio    95
*     -   nice      -19
*     -   memlock   unlimited
root  -   rtprio    95
root  -   nice      -19
root  -   memlock   unlimited
