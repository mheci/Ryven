# Arch wiki (Gaming -> Tweaking kernel parameters for response time
# consistency -> Make the changes permanent). The settings span /proc
# (sysctl) and /sys, so systemd-tmpfiles is the persistence mechanism.
# Values are the wiki's verbatim: proactive compaction off (jitter), one
# pageblock watermark boost, 1 GiB min_free_kbytes, 5% watermark scale,
# low swappiness, MGLRU with reduced contention (5), zone reclaim off,
# page lock unfairness 1, and CFS slice/migration tuning (inert while
# scx_lavd is loaded, effective on the CFS fallback).
# THP: ENABLED (always), deliberately overriding the wiki's "never" — this is
# the max-performance setting for Proton (the wiki's own TCMalloc caveat cuts
# the other way for Proton games). Reserved 2 MiB hugepage pool for Proton
# MAP_HUGETLB allocations: kargs.d/50-hugepages.toml.
#    Path                  Mode UID  GID  Age Argument
w /proc/sys/vm/compaction_proactiveness - - - - 0
w /proc/sys/vm/watermark_boost_factor - - - - 1
w /proc/sys/vm/min_free_kbytes - - - - 1048576
w /proc/sys/vm/watermark_scale_factor - - - - 500
w /proc/sys/vm/swappiness - - - - 10
w /sys/kernel/mm/lru_gen/enabled - - - - 5
w /proc/sys/vm/zone_reclaim_mode - - - - 0
w /sys/kernel/mm/transparent_hugepage/enabled - - - - always
w /sys/kernel/mm/transparent_hugepage/shmem_enabled - - - - always
w /sys/kernel/mm/transparent_hugepage/defrag - - - - always
w /proc/sys/vm/page_lock_unfairness - - - - 1
w /proc/sys/kernel/sched_child_runs_first - - - - 0
w /proc/sys/kernel/sched_autogroup_enabled - - - - 1
w /proc/sys/kernel/sched_cfs_bandwidth_slice_us - - - - 3000
w /sys/kernel/debug/sched/base_slice_ns  - - - - 3000000
w /sys/kernel/debug/sched/migration_cost_ns - - - - 500000
w /sys/kernel/debug/sched/nr_migrate - - - - 8
