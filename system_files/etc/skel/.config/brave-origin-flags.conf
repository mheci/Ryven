# Ryven default Brave Origin flags: NVIDIA hardware video decode (image
# default; CachyOS wiki Chromium HW-accel set + VaapiOnNvidiaGPUs for the
# shipped libva-nvidia-driver). AMD/Intel users, run once:
#   ujust brave-hwaccel amd|intel
# This file only seeds NEW users (copied from /etc/skel); existing users
# run the ujust command above. Verify at brave://gpu (Video Acceleration
# Information) and the DevTools Media tab (decoder: VaapiVideoDecoder).
--ozone-platform-hint=auto
--enable-features=VaapiVideoDecoder,AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,AcceleratedVideoEncoder,VaapiOnNvidiaGPUs,VaapiIgnoreDriverChecks
