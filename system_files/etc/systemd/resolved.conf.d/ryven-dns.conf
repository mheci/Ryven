[Resolve]
# Cloudflare DNS, encrypted by default. These are global resolvers applied to
# every link IN ADDITION to the per-connection (DHCP) DNS: local names still
# resolve through the local resolver first, and anything it cannot answer is
# answered by Cloudflare over DNS-over-TLS. Opportunistic: if the encrypted
# connection cannot be established (e.g. 853/QUIC blocked), systemd-resolved
# falls back to plain DNS for the same servers and keeps working.
# Cloudflare anycast: 1.1.1.1 (IPv4), 2606:4700:4700::1111 (IPv6),
# 1.0.0.1 / 2606:4700:4700::1001 (family-2 variants).
DNS=1.1.1.1 2606:4700:4700::1111 1.0.0.1 2606:4700:4700::1001
DNSOverTLS=yes
