# Arch wiki (Gaming -> Increase vm.max_map_count): set 2147483642
# (MAX_INT - 5) — the SteamOS default. A low value can affect the stability
# and performance of some games. Applied by systemd-sysctl at boot; /etc is
# the mutable layer, so this survives bootc updates.
vm.max_map_count = 2147483642
