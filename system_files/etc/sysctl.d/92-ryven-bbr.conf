# BBR congestion control (TCP BBR v2 where the kernel provides it): models
# bottleneck bandwidth and RTT instead of relying on loss as the congestion
# signal — noticeably better throughput and lower tail latency on high-BDP
# links (game downloads/updates, streaming, cloud gaming). Writing this
# sysctl loads the tcp_bbr module. Pairs with the fq_codel default qdisc
# (91-ryven-buffer-bloat.conf) that BBR is designed to work alongside.
net.ipv4.tcp_congestion_control = bbr
