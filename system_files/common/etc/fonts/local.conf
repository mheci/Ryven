<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Default UI font -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>Inter</family><family>Roboto</family><family>Cantarell</family><family>Noto Sans</family></prefer>
  </alias>
  <!-- Default monospace font -->
  <alias>
    <family>monospace</family>
    <prefer><family>JetBrains Mono</family><family>Fira Code</family><family>Cascadia Code</family><family>Iosevka Term</family></prefer>
  </alias>
  <!-- Subpixel rendering / hinting -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
