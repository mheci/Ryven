[main]
summary=Ryven Gaming (CachyOS LTO, performance governor, CAKE/BBR, desktop low-latency)

[cpu]
governor=performance
energy_perf_bias=performance
min_perf_pct=100

[sysctl]
kernel.sched_autogroup_enabled=0
kernel.sched_cfs_bandwidth_slice_us=3000
kernel.sched_migration_cost_ns=5000000
kernel.sched_min_granularity_ns=1500000
kernel.sched_wakeup_granularity_ns=1000000
kernel.split_lock_mitigate=0
kernel.nmi_watchdog=0
kernel.sysrq=244
kernel.core_pattern=|/bin/false
vm.overcommit_memory=1
vm.overcommit_ratio=80
vm.swappiness=1
vm.dirty_ratio=20
vm.dirty_background_ratio=5
vm.dirty_expire_centisecs=600
vm.dirty_writeback_centisecs=1500
vm.page-cluster=0
net.ipv4.tcp_fastopen=3
net.ipv4.tcp_thin_linear_timeouts=1
net.core.netdev_budget=600
net.core.netdev_budget_usecs=16000
net.core.default_qdisc=cake
net.ipv4.tcp_congestion_control=bbr

[disk]
# Kyber for SSD/NVMe; BFQ auto-selected for rotational disks via udev
devices_scheduler=kyber

[script]
script=${i:PROFILE_DIR}/script.sh
