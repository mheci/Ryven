# NVIDIA defaults for nvidia-open / Turing+
options nvidia_drm modeset=1 fbdev=1 abnt_hdmi_deepcolor=1
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_EnableGpuFirmware=1 NVreg_EnableResizableBar=1 Coolbits=28
options nvidia NVreg_InitializeSystemMemoryAllocations=0
# Blacklist open-source competing drivers (pure NVIDIA image)
blacklist nouveau
blacklist nvidiafb
