# Ryven — PipeWire daemon tuning (all images).
#
# PipeWire drop-ins replace whole top-level sections (pw_properties keeps
# each section as one raw JSON string), so this file restates the active
# keys of context.properties from /usr/share/pipewire/pipewire.conf
# (verified against 1.6.2) plus the deliberate changes:
#
#   log.level = 1                   errors only; keeps the per-stream info
#                                   chatter out of the journal.
#   default.clock.min-quantum = 256 clients can no longer force micro
#                                   quanta that xrun/crackle under load
#                                   (upstream default: 32).
#   cpu.zero.denormals = true       FTZ/DAZ on the daemon threads; stops
#                                   DSP loops (resample, filters) stalling
#                                   on denormal floats.
#
# Everything else stays at upstream defaults on purpose: fixed 48 kHz
# clock (no rate-switch glitches), quantum 1024 (~21 ms — plenty for
# gaming, small enough for voice chat). context.modules is deliberately
# NOT touched: module-rt keeps its rt.prio = 60 request, and the actual
# privilege to honor it is granted by the RTKit drop-in
# (/usr/lib/systemd/system/rtkit-daemon.service.d/95-ryven-realtime.conf)
# and the PAM rlimits (/etc/security/limits.d/95-ryven-realtime.conf).
#
# Fragments in /etc/pipewire/pipewire.conf.d/ load after this one and can
# override it per-user/per-admin.
context.properties = {
    log.level                   = 1
    link.max-buffers            = 16    # version < 3 clients can't handle more
    core.daemon                 = true
    core.name                   = pipewire-0
    cpu.zero.denormals          = true

    default.clock.rate          = 48000
    default.clock.quantum       = 1024
    default.clock.min-quantum   = 256
    default.clock.max-quantum   = 2048
    default.clock.quantum-limit = 8192
}
