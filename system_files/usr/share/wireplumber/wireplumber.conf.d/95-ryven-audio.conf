# Ryven — WirePlumber audio tuning (all images).
#
# WirePlumber 0.5 merges conf.d fragments per section (object sections
# deep-merge, array sections concatenate), so these rules are purely
# additive: they coexist with upstream defaults and with admin fragments
# in /etc/wireplumber/wireplumber.conf.d/.
#
# Never suspend idle audio nodes (session.suspend-timeout-seconds = 0
# makes scripts/node/suspend-node.lua return immediately). This kills the
# classic pop/crackle sources at the session-manager layer:
#   - HDA codec power-down/re-init clicks on resume,
#   - USB DAC re-enumeration hiccups after the 5 s idle timeout,
#   - Bluetooth transport teardown between short sounds (game UI, pings),
#   - first-play latency while a suspended device wakes up.
# The kernel/firmware half of the audio power-management ban lives in
# /usr/lib/modprobe.d/audio-powersave.conf, the udev rule
# 40-ryven-audio-power.rules, and the usbcore.autosuspend=-1 karg.
#
# ALSA: match both nodes (node.name rules apply at node creation) and the
# parent card (device properties are copied into nodes). Bluetooth: the
# card device's properties are inherited by its A2DP/HFP nodes.

monitor.alsa.rules = [
    {   matches = [
            { node.name = "~alsa_output.*" }
            { node.name = "~alsa_input.*" }
        ]
        actions = {
            update-props = {
                session.suspend-timeout-seconds = 0
            }
        }
    }
    {   matches = [
            { device.name = "~alsa_card.*" }
        ]
        actions = {
            update-props = {
                session.suspend-timeout-seconds = 0
            }
        }
    }
]

monitor.bluez.rules = [
    {   matches = [
            { device.name = "~bluez_card.*" }
        ]
        actions = {
            update-props = {
                session.suspend-timeout-seconds = 0
            }
        }
    }
]
