# falcond user-profile TEMPLATE — copy to
#   /usr/share/falcond/profiles/user/<your-game>.conf
# (or via: ujust falcond-profile name=<game-exe>) and edit `name`.
# User profiles override system profiles with the same name.
#
# Available options (falcond 2.x):
#   name              = exe name to match, e.g. "cs2", "Cyberpunk2077.exe"
#   performance_mode  = true|false   (system-wide performance while running)
#   scx_sched         = none|lavd|bpfland|rusty|flash   (per-game scheduler)
#   scx_sched_props   = none|default|gaming|power|latency|server
#   vcache_mode       = none|cache|freq   (AMD 3D vcache only; NVIDIA: none)
#   idle_inhibit      = true|false   (keep screen awake / no idle while running)
#   dmem_protect      = true|false   (GPU/device-memory cgroup protection;
#                                     needs cgroup v2 + CONFIG_CGROUP_DMEM)
#   disable_split_lock = true|false  (kernel.split_lock_mitigate=0 while running)
#   start_script      = sh -c snippet run as the game UID when it starts
#   stop_script       = sh -c snippet run when it stops
#
# Recommended starting point for an NVIDIA desktop (Ryven defaults):
name = "mygame.exe"
performance_mode = true
scx_sched = lavd
scx_sched_props = gaming
vcache_mode = none
idle_inhibit = true
dmem_protect = false
disable_split_lock = false
