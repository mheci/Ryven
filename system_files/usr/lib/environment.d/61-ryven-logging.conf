# Quiet runtimes: debug and warning channels off, error level kept.
# Applies to Wine/Proton and the graphics/media toolkits on all images.
# Wine channel classes: err stays on; fixme and warn are silenced.
WINEDEBUG=fixme-all,warn-all
# Proton diagnostic log stays off unless explicitly enabled per-game.
PROTON_LOG=0
# DXVK and vkd3d-proton log only errors.
DXVK_LOG_LEVEL=error
VKD3D_DEBUG=err
# Qt: debug, info, and warning categories off; critical/fatal still log.
QT_LOGGING_RULES=*.debug=false;*.info=false;*.warning=false
# GStreamer numeric levels: 0=none, 1=ERROR. Warnings and below are dropped.
GST_DEBUG=1
# Python runtimes: warning filters off; tracebacks and errors still print.
PYTHONWARNINGS=ignore
