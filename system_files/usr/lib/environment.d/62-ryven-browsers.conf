# Gecko browsers (Firefox + Zen) run natively on Wayland in every session.
# Tarball builds get no distro wrapper, so the env is set image-wide.
MOZ_ENABLE_WAYLAND=1
# Electron apps (Discord, VS Code, Signal, ...) pick the Wayland ozone
# platform themselves instead of falling back to XWayland under Plasma.
ELECTRON_OZONE_PLATFORM_HINT=auto
