# Shader / pipeline caches for GL, Vulkan, Mesa, DXVK, VKD3D, NVIDIA, CUDA.
# Per-user dirs stay under $HOME via driver defaults; do not force /var.
__GL_SHADER_DISK_CACHE=1
__GL_SHADER_DISK_CACHE_SKIP_CLEANUP=1
__GL_SHADER_DISK_CACHE_SIZE=1073741824
MESA_SHADER_CACHE_DISABLE=false
MESA_GLSL_CACHE_DISABLE=false
MESA_SHADER_CACHE_MAX_SIZE=2G
DXVK_STATE_CACHE=1
VKD3D_SHADER_CACHE=1
CUDA_CACHE_DISABLE=0
NVD_BACKEND=direct
