# 10 GiB shader / pipeline caches (NVIDIA GL, Mesa, DXVK, VKD3D, CUDA).
__GL_SHADER_DISK_CACHE=1
__GL_SHADER_DISK_CACHE_SKIP_CLEANUP=1
__GL_SHADER_DISK_CACHE_SIZE=10737418240
MESA_SHADER_CACHE_DISABLE=false
MESA_GLSL_CACHE_DISABLE=false
MESA_SHADER_CACHE_MAX_SIZE=10G
DXVK_STATE_CACHE=1
VKD3D_SHADER_CACHE=1
CUDA_CACHE_DISABLE=0
CUDA_CACHE_MAXSIZE=10737418240
# nvidia-vaapi-driver backend only; do not pin LIBVA_DRIVER_NAME globally
# (breaks iGPU/hybrid and some VA clients). libva-nvidia-driver is installed.
NVD_BACKEND=direct
