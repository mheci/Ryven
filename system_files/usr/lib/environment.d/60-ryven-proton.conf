# Proton defaults for Ryven gaming.
# NTSync rides the CachyOS LTO kernel; Wayland presentation skips Xwayland.
PROTON_USE_NTSYNC=1
PROTON_ENABLE_WAYLAND=1
# HDR is available but NOT forced: it forces modesets and trade-offs most
# users do not want. Enable per-game on an HDR display with a Steam launch
# option: PROTON_ENABLE_HDR=1 %command%.
PROTON_ENABLE_HDR=0
# DLSS upscaling + frame generation stay exposed and current: NVAPI makes
# DLSS visible to games, and PROTON_DLSS_UPGRADE=1 downloads the newest
# nvngx_dlss(d|g).dll plus the latest DXVK_NVAPI DRS preset at game launch
# (falls back to the bundled DLLs when offline). Verify with
# PROTON_DLSS_INDICATOR=1, or run `ujust dlss`.
PROTON_ENABLE_NVAPI=1
PROTON_DLSS_UPGRADE=1
