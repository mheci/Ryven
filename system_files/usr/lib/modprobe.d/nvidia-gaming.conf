# Same NVIDIA module parameters as bootc kargs.d/00-nvidia.toml for
# late loads. Sources: ArchWiki NVIDIA (DRM KMS, fbdev) and
# NVIDIA/Tips and tricks (PowerMizer PerfLevelSrc, PreserveVideoMemory).
blacklist nouveau
options nouveau modeset=0
options nvidia-drm modeset=1 fbdev=1
options nvidia NVreg_PreserveVideoMemoryAllocations=1 \
  NVreg_TemporaryFilePath=/var/tmp \
  NVreg_EnableResizableBar=1 \
  NVreg_EnablePCIeGen3=1 \
  NVreg_UsePageAttributeTable=1 \
  NVreg_EnableStreamMemOPs=1 \
  NVreg_DynamicPowerManagement=0 \
  NVreg_EnableGpuFirmware=1 \
  NVreg_RegistryDwords=PerfLevelSrc=0x2222
