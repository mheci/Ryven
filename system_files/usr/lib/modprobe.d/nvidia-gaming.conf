# NVIDIA module parameters (single source of truth; also applied via
# kernel cmdline where the driver is loaded early). Sources: ArchWiki
# NVIDIA (DRM KMS, fbdev) and NVIDIA/Tips and tricks (PowerMizer
# PerfLevelSrc, PreserveVideoMemory). Link speed is left to driver
# auto-negotiation on purpose: NVreg_EnablePCIeGen3=1 would cap modern
# GPUs at PCIe Gen3 bandwidth.
blacklist nouveau
options nouveau modeset=0
options nvidia-drm modeset=1 fbdev=1
options nvidia NVreg_PreserveVideoMemoryAllocations=1 \
  NVreg_TemporaryFilePath=/var/tmp \
  NVreg_EnableResizableBar=1 \
  NVreg_UsePageAttributeTable=1 \
  NVreg_EnableStreamMemOPs=1 \
  NVreg_DynamicPowerManagement=0 \
  NVreg_EnableGpuFirmware=1 \
  NVreg_RegistryDwords=PerfLevelSrc=0x2222
