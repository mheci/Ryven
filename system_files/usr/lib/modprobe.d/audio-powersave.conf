# Ban driver-internal ALSA idle power management.
#
# snd_hda_intel power_save=N powers the HDA codec down after N seconds of
# silence (power_save_controller additionally parks the PCI controller) —
# the classic "first sound after idle pops/clicks, then clean" failure.
# 0 disables it. snd_ac97_codec covers legacy AC'97 hardware with the same
# knob. This is the driver layer; the PCI runtime-PM layer is handled by
# /usr/lib/udev/rules.d/40-ryven-audio-power.rules and USB autosuspend by
# the usbcore.autosuspend=-1 kernel argument (60-usb-autosuspend.toml).
options snd_hda_intel power_save=0 power_save_controller=0
options snd_ac97_codec power_save=0
