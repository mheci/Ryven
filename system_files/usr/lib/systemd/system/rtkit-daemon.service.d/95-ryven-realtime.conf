# Give PipeWire's data loops the SCHED_FIFO priority they actually ask for.
#
# module-rt requests rt.prio = 60, but upstream RTKit caps clients at
# priority 20 (it runs itself at 21 and refuses anything at or above its
# own priority), and PipeWire clamps to the MaxRealtimePriority the
# daemon advertises — so stock Fedora runs the whole audio stack at
# FIFO 20 instead of 60. xdg-desktop-portal's Realtime interface is a
# pure pass-through to RTKit (it mirrors MaxRealtimePriority and
# forwards MakeThreadRealtimeWithPID), so this one drop-in covers both
# the portal path and the direct RTKit path.
#
# Both knobs must move together: rtkit-daemon exits at startup unless
# our-realtime-priority > max-realtime-priority. 88 is the conventional
# ceiling for audio clients (JACK/PipeWire rt.prio convention). The
# 200 ms RLIMIT_RTTIME watchdog stays at its default, so a runaway RT
# thread gets throttled instead of hard-locking a core.
#
# The PAM rlimits in /etc/security/limits.d/95-ryven-realtime.conf cover
# the fallback path where module-rt sets SCHED_FIFO directly via
# RLIMIT_RTPRIO (no portal, no rtkit).
[Service]
ExecStart=
ExecStart=/usr/libexec/rtkit-daemon --our-realtime-priority=89 --max-realtime-priority=88
