# Minimal animations: workspace slide only, no window open/close spin
animations {
    enabled = true
    bezier = myBezier, 0.4, 0, 0.2, 1

    animation = workspaces, 1, 8, myBezier, slide
    animation = windows, 1, 80, myBezier, popin 80%
    animation = windowsOut, 1, 80, myBezier, popin 80%, popin
    animation = fade, 1, 100, default
    animation = fadeLayers, 1, 100, default
    animation = border, 1, 100, default
    animation = borderangle, 1, 600, default, linerotate
    animation = shader, 1, 100, default
}

# No fancy shadow fade; fast animations for low latency
default_floating_window_rounded = true
