# Tearing rules: allow tearing only for fullscreen gaming windows matching known clients.
# Users add their own classes in ~/.config/hypr/conf.d/tearing.conf
windowrulev2 = allow_tearing,fullscreen:1,class:(steam_app_.*|wine|proton|hl2_linux|Lutris|heroic|Bottles|gamescope.*|cs2|factorio|Faugus)

# Inhibit sleep/lock when fullscreen gaming window focused
windowrulev2 = idleinhibit always,fullscreen:1,class:(steam_app_.*|wine|proton|hl2_linux|Lutris|heroic|Bottles|gamescope.*|cs2|factorio|Faugus)
