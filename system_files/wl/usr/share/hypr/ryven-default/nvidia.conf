# Hyprland defaults for nvidia-open 610+ (explicit sync, no legacy hacks)
env = NVD_BACKEND,direct        # default for nvidia-open 610+ GBM
env = __GL_GSYNC_ALLOWED,1
env = __GL_VRR_ALLOWED,1
env = WLR_NO_HARDWARE_CURSORS,0
env = CLUTTER_DEFAULT_VBLANK,
env = GBM_BACKEND,
env = __GLX_VENDOR_LIBRARY_NAME,

explicit_sync = 2
cursor {
    no_hardware_cursors = false
    use_cpu_copy_on_nvidia = true
    default_monitor =
    xray_length = 0
}

drm {
    direct_scanout = true
    enabled = true
}
