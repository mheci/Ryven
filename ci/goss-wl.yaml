file:
  /usr/share/hypr/hyprland.conf:
    exists: true
    contains:
      - layout = master
      - allow_tearing = true
  /usr/lib/bootc/kargs.d/00-nvidia.toml:
    exists: true
  /usr/lib/bootc/kargs.d/10-zswap.toml:
    exists: true
  /etc/greetd/config.toml:
    exists: true
  /etc/xdg/quickshell/shell.qml:
    exists: true

package:
  hyprland:
    installed: true
  quickshell:
    installed: true
  dunst:
    installed: true
  cliphist:
    installed: true
  wl-clipboard:
    installed: true
  ffmpeg:
    installed: true

command:
  no-libva-nvidia-env:
    exec: grep -rE '^[[:space:]]*LIBVA_DRIVER_NAME=nvidia' /usr/share/hypr /usr/lib/environment.d /etc/xdg/uwsm
    exit-status: 1
  no-docker:
    exec: rpm -q docker
    exit-status: 1
