file:
  /usr/share/sway/config.d/50-ryven.conf:
    exists: true
    contains:
      - allow_tearing yes
  /usr/lib/bootc/kargs.d/00-nvidia.toml:
    exists: true
  /usr/lib/bootc/kargs.d/10-zswap.toml:
    exists: true

package:
  sway:
    installed: true
  dunst:
    installed: true
  wl-clipboard:
    installed: true
  ffmpeg:
    installed: true

command:
  no-libva-nvidia-env:
    exec: grep -rE '^[[:space:]]*LIBVA_DRIVER_NAME=nvidia' /usr/share/sway /usr/lib/environment.d
    exit-status: 1
  no-docker:
    exec: rpm -q docker
    exit-status: 1
